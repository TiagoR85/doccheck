[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doccheck"
version = "0.1.0"
description = "Verifica se a documentacao e o codigo dizem a mesma coisa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
doccheck = "doccheck.cli:main"

[tool.setuptools.packages.find]
include = ["doccheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
