[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doccheck"
version = "0.2.0"
description = "Verifica se a documentacao e o codigo dizem a mesma coisa"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/TiagoR85/doccheck"
Issues = "https://github.com/TiagoR85/doccheck/issues"

[project.scripts]
doccheck = "doccheck.cli:main"

[tool.setuptools.packages.find]
include = ["doccheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
